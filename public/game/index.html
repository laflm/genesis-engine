/* =====================================================================

               shop arcade house gate, and 'item_<itemId>' to skin an equipped item.
               New skin/NPC look: add SKINS.myskin=(e)=>{...draw at feet (0,0)...}, then use skin:'myskin'.

               gear overlays use the same layout: loadSheet('item_sword','sword.png',{...same}). Works for any skin key.

               use:e=>{} (consumable), shop:true to be sold). Recipes: RECIPES. Drops: ENEMY[..].drops.
 4 ABILITIES   ABIL (behaviour) + TREE (unlock cost/requirement). New ability = 1 entry in each. Item gives it via abil.
 5 ENEMIES     ENEMY table = new NPCs (all extend Entity, same as the player).
 6 LEVELS      LEVELS[] = levels. stages:[{type,len,n,shop}] any count; boss:{...}. New stage mechanic =
               STAGE_TYPES.mytype={init(S),update(S,dt),draw(S)}; then type:'mytype' in a stage.
 7 BUILDINGS   class Building -> Shop, Arcade, House, Gate. Add class Foo extends Building{interact(){}} and put
               new Foo(x) in the lobby (goLobby) or in a stage (goStage).
 8 MECHANICS   add a function to MECH[] — it runs every frame with (dt). Save data: save()/load().
 ===================================================================== */

function box(x,y,w,h,col,r=6){ink(rr(x,y,w,h,r),col,1)} // hand-inked

<script>
// Black Boy Go! PWA update handling. Does not clear localStorage or game saves.
if ('serviceWorker' in navigator) {
  let acceptedUpdate = false;
  let reloadingForUpdate = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (acceptedUpdate && !reloadingForUpdate) {
      reloadingForUpdate = true;
      window.location.reload();
    }
  });

  async function checkForGameUpdate(registration) {
    try { await registration.update(); } catch (_) {}
    const waitingWorker = registration.waiting;
    if (waitingWorker && !acceptedUpdate) {
      if (window.confirm('A new version of Black Boy Go! is ready. Reload now? Your saved game will be kept.')) {
        acceptedUpdate = true;
        waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      }
    }
  }

  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
      await checkForGameUpdate(registration);
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            checkForGameUpdate(registration);
          }
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForGameUpdate(registration);
      });
    } catch (error) {
      console.warn('Black Boy Go! update check failed:', error);
    }
  });
}
</script>
